<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21262d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    .stat-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 12px; fill: #64748b; }
    .stat-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 16px; fill: #f8fafc; }
    
    /* Subtle background animations */
    @keyframes float1 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
    @keyframes float2 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(8px); } }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; } }

    .animated-card-1 { animation: float1 6s ease-in-out infinite; }
    .animated-card-2 { animation: float2 7s ease-in-out infinite; }
    .pulse-bg { animation: pulse 4s ease-in-out infinite; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>

  <!-- Background Grid Lines -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Glowing Background Orbs -->
  <circle cx="150" cy="100" r="120" fill="#7c3aed" opacity="0.15" filter="url(#glow)" class="pulse-bg" />
  <circle cx="1050" cy="300" r="140" fill="#06b6d4" opacity="0.15" filter="url(#glow)" class="pulse-bg" />

  <!-- Background Dynamic Graphic Elements -->
  <g class="animated-card-1" opacity="0.6">
    <!-- Network Data Node Graph -->
    <path d="M 850 120 L 950 80 L 1050 140 L 980 220 L 880 200 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" />
    <circle cx="850" cy="120" r="6" fill="#a855f7" />
    <circle cx="950" cy="80" r="8" fill="#3b82f6" />
    <circle cx="1050" cy="140" r="7" fill="#06b6d4" />
    <circle cx="980" cy="220" r="6" fill="#10b981" />
    <circle cx="880" cy="200" r="5" fill="#f59e0b" />
  </g>

  <g class="animated-card-2" opacity="0.5">
    <!-- Floating Security Stat Card 1 -->
    <rect x="840" y="250" width="150" height="70" rx="10" fill="url(#cardGrad)" stroke="#30363d" />
    <text x="855" y="275" class="badge-text">PII DETECTED</text>
    <text x="855" y="300" class="stat-val">99.9% Accuracy</text>

    <!-- Floating Security Stat Card 2 -->
    <rect x="1010" y="180" width="140" height="70" rx="10" fill="url(#cardGrad)" stroke="#30363d" />
    <text x="1025" y="205" class="badge-text">MARKET SIZE</text>
    <text x="1025" y="230" class="stat-val">$15.2B by 2030</text>
  </g>

  <!-- Foreground Header Tag -->
  <rect x="80" y="55" width="240" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
  <text x="95" y="74" class="badge-text" fill="#818cf8">🛡️ DATA SECURITY &amp; DSPM 2026</text>

  <!-- Main Title & Subtitle -->
  <text x="80" y="130" class="title">Awesome Sensitive Data Discovery</text>
  <text x="80" y="168" class="subtitle">Curated DSPM Platforms, PII Scanners, &amp; Open-Source Security Tools</text>

  <!-- Feature Pills / Highlights -->
  <g transform="translate(80, 205)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="170" height="34" rx="8" fill="#162032" stroke="#1d4ed8" stroke-width="1" />
    <text x="14" y="22" class="badge-text" fill="#60a5fa">🔍 PII &amp; Secrets Discovery</text>

    <!-- Pill 2 -->
    <rect x="182" y="0" width="165" height="34" rx="8" fill="#1e1035" stroke="#7e22ce" stroke-width="1" />
    <text x="196" y="22" class="badge-text" fill="#c084fc">🛡️ Cloud DSPM &amp; DLP</text>

    <!-- Pill 3 -->
    <rect x="359" y="0" width="180" height="34" rx="8" fill="#062e2b" stroke="#0f766e" stroke-width="1" />
    <text x="373" y="22" class="badge-text" fill="#2dd4bf">⚡ 25+ Open Source Tools</text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="80" y="325" width="1040" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- Footer Info inside Banner -->
  <text x="80" y="355" class="stat-label">COMMERCIAL &amp; OPEN-SOURCE ECOSYSTEM DIRECTORY</text>
  <text x="1120" y="355" class="stat-label" text-anchor="end">UPDATED OCTOBER 2026</text>
</svg>
